name: Android APK (debug)

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"
      - "backend/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "نشر هذا الإصدار في GitHub Releases ليظهر داخل التطبيق"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-apk-main-v2
  cancel-in-progress: false

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform and build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --non-interactive

      - name: Set up Python for backend offline-sync tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test offline Content Sync transformation
        run: |
          python -m pip install --disable-pip-version-check httpx
          python -m py_compile backend/lib/qf_offline.py backend/lib/quran_source.py backend/routers/offline.py backend/routers/quran.py backend/server.py
          python -m unittest discover -s backend/tests -p "test_offline_export.py"

      - name: Check Android API base URL configuration
        env:
          ANDROID_API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL }}
        run: |
          if [ -z "$ANDROID_API_BASE_URL" ]; then
            echo "::warning::Repository variable ANDROID_API_BASE_URL is missing. Android will use relative /api and cannot reach the remote backend from its local WebView."
          fi

      - name: Build web application
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL || 'https://athar-kareem-api.onrender.com/api' }}
        run: yarn build

      - name: Generate Android project if missing
        working-directory: frontend
        run: |
          if [ ! -d android ]; then
            yarn cap add android
          fi
          yarn cap sync android

      - name: Prepare permanent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          python - <<'PY'
          import base64, os
          encoded = "".join(os.environ["ANDROID_KEYSTORE_BASE64"].split())
          data = base64.b64decode(encoded, validate=True)
          if not data:
              raise SystemExit("Decoded Android keystore is empty")
          path = "frontend/android/app/athar-kareem-upload.jks"
          with open(path, "wb") as keystore:
              keystore.write(data)
          PY
          keytool -list -keystore frontend/android/app/athar-kareem-upload.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed debug and release APKs
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: athar-kareem-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: athar-kareem-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: athar-kareem-release-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android release for in-app updates
        # One-time publish trigger for the approved v1.0.3 release.
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release-v1.0.3]'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(grep -oE 'versionName "[^"]+"' frontend/android/app/build.gradle | head -n 1 | cut -d '"' -f 2)"
          test -n "$VERSION" || { echo "::error::Could not read Android versionName"; exit 1; }
          TAG="v$VERSION"
          APK="frontend/android/app/build/outputs/apk/release/app-release.apk"
          gh release view "$TAG" >/dev/null 2>&1 && { echo "::error::Release $TAG already exists"; exit 1; }
          gh release create "$TAG" "$APK#Athar Kareem Android APK" --title "أثر كريم $TAG" --notes "إصدار أندرويد $VERSION. يمكن تثبيته كتحديث فوق النسخة الحالية مع الحفاظ على البيانات المحلية."


      - name: Commit generated Android project and Yarn lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/yarn.lock frontend/android
          if git diff --cached --quiet; then
            echo "No generated Android or lockfile changes to commit."
          else
            git commit -m "build(android): add generated Android project and lockfile"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
