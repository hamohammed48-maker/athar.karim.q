name: Android APK (debug)

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-main-v2
  cancel-in-progress: false

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform and build tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --non-interactive

      - name: Set up Python for backend offline-sync tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test offline Content Sync transformation
        run: |
          python -m pip install --disable-pip-version-check httpx
          python -m py_compile backend/lib/qf_offline.py backend/lib/quran_source.py backend/routers/offline.py backend/routers/quran.py backend/server.py
          python -m unittest discover -s backend/tests -p "test_offline_export.py"

      - name: Check Android API base URL configuration
        env:
          ANDROID_API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL }}
        run: |
          if [ -z "$ANDROID_API_BASE_URL" ]; then
            echo "::warning::Repository variable ANDROID_API_BASE_URL is missing. Android will use relative /api and cannot reach the remote backend from its local WebView."
          fi

      - name: Build web application
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL }}
        run: yarn build

      - name: Generate Android project if missing
        working-directory: frontend
        run: |
          if [ ! -d android ]; then
            yarn cap add android
          fi
          yarn cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: athar-kareem-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated Android project and Yarn lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/yarn.lock frontend/android
          if git diff --cached --quiet; then
            echo "No generated Android or lockfile changes to commit."
          else
            git commit -m "build(android): add generated Android project and lockfile"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
